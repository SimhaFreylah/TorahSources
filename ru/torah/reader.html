<!DOCTYPE html>
<html lang="ru" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тора | TorahSources</title>

    <link rel="stylesheet" href="../../style.css">


    <link rel="icon" type="image/png" sizes="16x16" href="../../images/16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../images/32.png">
    <link rel="icon" type="image/png" sizes="180x180" href="../../images/180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../images/180.png">
</head>


<body>

<main class="torah-reader-layout">

    <!-- ==================================================
         ЛЕВАЯ КОЛОНКА: КНИГИ
         ================================================== -->

    <aside class="torah-books-panel">

        <div class="reader-logo-box">
            <a href="../index.html">
                <img class="reader-logo"
                     src="../../images/TorahSourcesHD.png"
                     alt="TorahSources logo">
            </a>
        </div>

        <nav class="reader-language-switch"
             aria-label="Language selection">

            <a href="../../en/index.html" lang="en">EN</a>
            <a href="../../ru/index.html" lang="ru">RU</a>
            <a href="../../he/index.html" lang="he" dir="rtl">עב</a>

        </nav>

        <nav class="torah-books-list" id="bookList">

            <a href="#" data-book="bereshit">Берешит</a>
            <a href="#" data-book="shemot">Шмот</a>
            <a href="#" data-book="vayikra">Ваикра</a>
            <a href="#" data-book="bemidbar">Бемидбар</a>
            <a href="#" data-book="devarim">Дварим</a>

        </nav>

    </aside>


    <!-- ==================================================
         СРЕДНЯЯ КОЛОНКА: ГЛАВЫ
         ================================================== -->

    <aside class="torah-chapters-panel">

        <div class="chapters-title">Гл.</div>

        <div class="torah-chapters-list"
             id="chapterList">
        </div>

    </aside>


    <!-- ==================================================
         ПРАВАЯ КОЛОНКА: ТЕКСТ
         ================================================== -->

    <section class="torah-content-panel">


        <!-- Компактный sticky-заголовок -->

        <div id="stickyChapterHeader"
             class="sticky-chapter-header"
             aria-hidden="true">

            <span id="stickyChapterRu"
                  class="sticky-chapter-ru">
            </span>

            <span class="sticky-chapter-divider">
                |
            </span>

            <span id="stickyChapterHe"
                  class="sticky-chapter-he"
                  lang="he"
                  dir="rtl">
            </span>

        </div>


        <!-- Большой основной заголовок -->

        <header class="torah-reader-header">

            <h1 id="chapterTitle"
                class="reader-main-title">
            </h1>

        </header>


        <!-- Текст главы -->

        <article id="chapterText"
                 class="torah-chapter-text">

        </article>


    </section>

</main>


<script src="../../js/torah-reader.js?v=5"></script>

</body>


</html>
