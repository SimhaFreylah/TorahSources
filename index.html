<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorahSources</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" sizes="16x16" href="images/16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/32.png">
    <link rel="icon" type="image/png" sizes="180x180" href="images/180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/180.png">
</head>

<body>

<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; width: 100%; padding: 20px 40px 0 40px; box-sizing: border-box;">

    <div style="justify-self: start;">
        <h1 style="margin: 0; opacity: 0.70; font-size: clamp(42px, 4vw, 72px); color: #fff;">
            TorahSources
        </h1>
    </div>

    <div style="justify-self: center;">
        <a href="index.html">
            <img src="images/TorahSourcesHD.png" alt="TorahSources logo"
                 style="display: block; width: clamp(110px, 9vw, 170px); height: auto;">
        </a>
    </div>

    <div style="justify-self: end;"></div>

</header>

<main>
    <p style="text-align: center; font-size: clamp(18px, 2vw, 28px); margin-top: 50px;">
        <span lang="en">Select your language</span> /
        <span lang="ru">Выберите язык</span> /
        <span lang="he" dir="rtl">בחר שפה</span>
    </p>

    <nav aria-label="Language selection" style="text-align: center; margin-top: 20px;">
        <a href="en/index.html" lang="en"
           style="display: inline-flex; align-items: center; justify-content: center; width: 180px; height: 100px; margin: 0 20px; font-size: 28px; text-decoration: none; color: #fff; background-color:#000000; border: 1px solid #fff; border-radius: 20px;">
            English
        </a>

        <a href="ru/index.html" lang="ru"
           style="display: inline-flex; align-items: center; justify-content: center; width: 180px; height: 100px; margin: 0 20px; font-size: 28px; text-decoration: none; color: #fff; background-color: #000000; border: 1px solid #fff; border-radius: 20px;">
            Русский
        </a>

        <a href="he/index.html" lang="he" dir="rtl"
           style="display: inline-flex; align-items: center; justify-content: center; width: 180px; height: 100px; margin: 0 20px; font-size: 28px; text-decoration: none; color: #fff; background-color: #000000; border: 1px solid #fff; border-radius: 20px;">
            עברית
        </a>
    </nav>
</main>

</body>
</html>
